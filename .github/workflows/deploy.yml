name: Deploy play

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test            # 괘 계산과 풀이 데이터 검사
      - run: npm run build       # vendor 사본 + outline + 괘별 풀이 파일
      - name: 빌드 결과가 커밋본과 같은지 확인
        run: |
          git add -A data public
          git diff --cached --exit-code data public   # 새로 생긴 파일도 함께 본다
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public         # 빌드 없는 정적 사이트. public 폴더를 그대로 올린다.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
